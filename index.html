<style>

/* =========================================================
   BASIC PAGE
   ========================================================= */

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#eaf3ff,#f7fbff);
  color:#1f2937;
  min-height:100vh;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.card{
  width:min(950px,100%);
  min-height:650px;
  background:#ffffff;
  border-radius:24px;
  box-shadow:0 12px 40px rgba(0,0,0,.12);
  padding:40px;
  display:flex;
  flex-direction:column;
}


/* =========================================================
   PROGRESS BAR
   ========================================================= */

.progress{
  height:8px;
  background:#e5e7eb;
  border-radius:8px;
  overflow:hidden;
  margin-bottom:28px;
}

.progress>div{
  height:100%;
  background:#1976d2;
  transition:.25s;
}


/* =========================================================
   HEADINGS
   ========================================================= */

h1{
  font-size:29px;
  margin:0 0 12px;
  color:#1565c0;
  line-height:1.35;
}

h2{
  font-size:24px;
  line-height:1.4;
  margin:0 0 16px;
  color:#1976d2;
}

h3{
  color:#1565c0;
}


/* =========================================================
   TEXT
   ========================================================= */

.subtitle{
  color:#5f6b7a;
  line-height:1.6;
  margin-bottom:22px;
}

.question{
  flex:1;
  overflow:auto;
}

.question p{
  line-height:1.6;
  font-size:17px;
}


/* =========================================================
   INPUTS
   ========================================================= */

label{
  display:block;
  font-size:17px;
  margin:14px 0 8px;
  font-weight:600;
}

.option{
  display:flex;
  align-items:flex-start;
  gap:10px;
  font-weight:400;

  background:#f7fbff;

  border:1px solid #d7e7f7;
  border-radius:12px;

  padding:13px;
  margin:9px 0;

  cursor:pointer;

  transition:.2s;
}

.option:hover{
  background:#edf6ff;
  border-color:#90caf9;
}

.option input{
  margin-top:4px;
  transform:scale(1.15);
}

input[type=text],
input[type=number],
input[type=date],
select,
textarea{
  width:100%;
  padding:13px 14px;

  border:1px solid #cbd5e1;
  border-radius:10px;

  font-size:16px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#1976d2;

  box-shadow:
  0 0 0 3px rgba(25,118,210,.10);
}


/* =========================================================
   GRID
   ========================================================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}


/* =========================================================
   BOX
   ========================================================= */

.box{
  border:1px solid #d7e7f7;

  border-radius:14px;

  padding:18px;

  margin-top:15px;

  background:#fbfdff;
}

.box h3{
  margin:0 0 14px;

  font-size:18px;

  color:#1565c0;

  text-align:center;
}


/* =========================================================
   OTHER
   ========================================================= */

.other-box{
  margin-top:12px;
  margin-bottom:15px;
}

.other-box label{
  color:#1565c0;
  font-size:15px;
}


/* =========================================================
   GENERAL QUESTION IMAGE
   ========================================================= */

.question-image-wrap{

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  margin:18px 0 24px;
}

.question-image{

  width:100%;

  max-width:760px;

  height:340px;

  object-fit:contain;

  object-position:center;

  display:block;

  margin:auto;

  border-radius:16px;

  border:1px solid #d7e7f7;

  background:#ffffff;

  padding:8px;
}


/* =========================================================
   LARGE IMAGE
   For mind maps, education, sleep images, etc.
   ========================================================= */

.large-question-image{

  width:100%;

  max-width:800px;

  height:420px;

  object-fit:contain;

  object-position:center;

  display:block;

  margin:18px auto 25px;

  border-radius:16px;

  border:1px solid #d7e7f7;

  background:#ffffff;

  padding:8px;
}


/* =========================================================
   IMAGE OPTIONS
   Used for Urban/Suburban/Rural and family structure
   ========================================================= */

.image-options{

  display:grid;

  grid-template-columns:
  repeat(3,1fr);

  gap:20px;

  margin-top:20px;

  align-items:start;
}

.image-option{

  border:1px solid #d7e7f7;

  border-radius:16px;

  background:#f7fbff;

  padding:12px;

  cursor:pointer;

  transition:.2s;

  text-align:center;
}

.image-option:hover{

  background:#edf6ff;

  border-color:#90caf9;

  transform:translateY(-2px);
}

.image-option img{

  width:100%;

  height:250px;

  object-fit:contain;

  object-position:center;

  border-radius:12px;

  display:block;

  margin-bottom:12px;

  background:#ffffff;

  padding:5px;
}

.image-option label{

  margin:0;

  font-weight:500;

  cursor:pointer;

  text-align:left;
}

.image-option input{

  margin-right:7px;

  transform:scale(1.15);
}


/* =========================================================
   NAVIGATION
   ========================================================= */

.nav{

  display:flex;

  justify-content:space-between;

  gap:12px;

  margin-top:25px;
}

button{

  border:0;

  border-radius:10px;

  padding:13px 24px;

  font-size:16px;

  font-weight:700;

  cursor:pointer;

  transition:.2s;
}

.back{

  background:#e5e7eb;

  color:#111827;
}

.back:hover{

  background:#d1d5db;
}

.next,
.submit{

  background:#1976d2;

  color:#ffffff;
}

.next:hover,
.submit:hover{

  background:#1565c0;
}


/* =========================================================
   ERROR
   ========================================================= */

.error{

  color:#b91c1c;

  background:#fee2e2;

  padding:10px;

  border-radius:8px;

  margin-top:10px;

  display:none;
}


/* =========================================================
   SUCCESS
   ========================================================= */

.success{

  text-align:center;

  padding:50px 20px;
}

.success h1{

  color:#1565c0;
}


/* =========================================================
   INSTRUCTIONS
   ========================================================= */

.instructions{

  line-height:1.7;
}

.instructions li{

  margin-bottom:10px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:700px){

  .wrap{
    padding:12px;

    min-height:95vh;

    border-radius:18px;

  .grid{

    grid-template-columns:1fr;
  }

  .image-options{

    grid-template-columns:1fr;
  }

  .image-option img{

    height:300px;
  }

  .question-image{

    height:330px;
  }

  .large-question-image{

    height:380px;
  }

  h1{

    font-size:24px;
  }

  h2{

    font-size:20px;
  }

</style>

function image(file,alt="Question image"){

alt="${alt}"

onerror="this.style.display='none'">

</div>

`;

<input

type="${x.type || 'radio'}"

name="${x.name}"

value="${x.value}"

${x.required ? "required" : ""}>

<span>

${x.label}

</span>

</label>

`).join("");

}

<label>

<input

type="radio"

name="${name}"

value="${x.value}"

required>

</label>


</div>

`).join("")}

</div>

`;

`;


/* =========================================================
   COLLECT DATA
   ========================================================= */

function collect(){

document.querySelectorAll(

"#app input,#app select,#app textarea"

).forEach(el=>{


if(

(el.type==="checkbox" ||
el.type==="radio")

&&

!el.checked

)

return;


if(el.name){


if(el.type==="checkbox"){

data[el.name]=

data[el.name]

?

data[el.name]+", "+el.value

:

el.value;

}

else{

data[el.name]=el.value;

}

}

});

}


/* =========================================================
   SCREEN BREAKS SHOW / HIDE LOGIC
   ========================================================= */

function setupScreenBreakLogic(){

  const details =
    document.getElementById("screenBreakDetails");

  if(!details) return;

  const radios =
    document.querySelectorAll(
      'input[name="screen_breaks"]'
    );

  function updateScreenBreakDetails(){

    const answer =
      document.querySelector(
        'input[name="screen_breaks"]:checked'
      );

    const showDetails =
      answer && answer.value === "Yes";

    details.style.display =
      showDetails ? "block" : "none";

    if(!showDetails){

      document
        .querySelectorAll(
          'input[name="screen_sessions"]'
        )
        .forEach(el => {
          el.checked = false;
        });

      document
        .querySelectorAll(
          'input[name="screen_morning"],' +
          'input[name="screen_afternoon"],' +
          'input[name="screen_evening"],' +
          'input[name="screen_night"]'
        )
        .forEach(el => {
          el.value = "";
        });
    }
  }

  radios.forEach(radio => {

    radio.addEventListener(
      "change",
      updateScreenBreakDetails
    );

  });

  updateScreenBreakDetails();
}
   
/* =========================================================
   RENDER
   ========================================================= */

function render(){


if(page===-1){


document.getElementById("app")
.innerHTML=introHTML;


document.getElementById("nav")
.style.display="flex";


document.getElementById("back")
.style.visibility="hidden";


document.getElementById("next")
.textContent=
"Start Questionnaire / प्रश्नावली शुरू करें";


document.getElementById("bar")
.style.width="0%";


return;

}


const q=questions[page];


document.getElementById("app")
.innerHTML=`

<div class="question">


<h2>

${q.title}

</h2>


${q.html}


<div
id="err"
class="error">

Please answer the required question
before continuing.

<br>

कृपया आगे बढ़ने से पहले आवश्यक
प्रश्न का उत्तर दें।

</div>


</div>

`;


/* Restore previous answers */

Object.keys(data).forEach(k=>{

document

.querySelectorAll(
`[name="${CSS.escape(k)}"]`
)

.forEach(el=>{


if(

el.type==="checkbox" ||
el.type==="radio"

){

el.checked=

data[k]
.split(", ")
.includes(el.value);

}

else{

el.value=data[k];

}

});

});
setupScreenBreakLogic();

document.getElementById("back")
.style.visibility=

page===0
?
"hidden"
:
"visible";


document.getElementById("next")
.textContent=

page===questions.length-1

?

"Submit / जमा करें"

:

"Next / आगे";


document.getElementById("bar")
.style.width=

((page+1)/questions.length*100)+"%";

}


/* =========================================================
   VALIDATION
   ========================================================= */

function valid(){


const err=
document.getElementById("err");


/* Required text / number inputs */

const requiredInputs=
document.querySelectorAll(
"#app input[required]"
);


for(const el of requiredInputs){


if(
el.type==="radio" ||
el.type==="checkbox"
)

continue;


if(!el.value.trim()){

err.style.display="block";

el.focus();

return false;

}

}


/* Radio groups */

const radios=
[

...document.querySelectorAll(
"#app input[type=radio]"
)

];


const radioNames=
[

...new Set(
radios.map(x=>x.name)
)

];


for(const name of radioNames){

    // If the participant selected "No" for screen breaks,
    // do not require an answer for screen_sessions.
    if(name === "screen_sessions"){

        const screenBreakAnswer =
        document.querySelector(
            'input[name="screen_breaks"]:checked'
        );

        if(
            screenBreakAnswer &&
            screenBreakAnswer.value === "No"
        ){
            continue;
        }
    }

    const checked =
    document.querySelector(
        `#app input[type=radio][name="${CSS.escape(name)}"]:checked`
    );

    if(!checked){

        err.style.display="block";

        return false;

    }

}


return true;

}


/* =========================================================
   NEXT
   ========================================================= */

function next(){


if(page===-1){

page=0;

render();

return;

}


if(!valid())
return;


collect();


if(page<questions.length-1){

page++;

render();

window.scrollTo(0,0);

}

else{

submitForm();

}

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function prev(){


if(page===-1)
return;


collect();


if(page>0){

page--;

render();

window.scrollTo(0,0);

}

else{

page=-1;

render();

}

}

   SUBMIT
   ========================================================= */

async function submitForm(){


document.getElementById("nav")
.style.display="none";


document.getElementById("app")
.innerHTML=`

<div class="success">

<h1>

Submitting… / जमा किया जा रहा है…

</h1>

<p>

Please wait.

</p>

</div>

`;


/* =========================================================
   TIMESTAMP
   ========================================================= */

const now=new Date();


const months=[

"Jan",
"Feb",
"Mar",
"Apr",
"May",
"Jun",
"Jul",
"Aug",
"Sep",
"Oct",
"Nov",
"Dec"

];


const day=
String(now.getDate())
.padStart(2,"0");


const month=
months[now.getMonth()];


const year=
now.getFullYear();


let hours=
now.getHours();


const minutes=
String(now.getMinutes())
.padStart(2,"0");


const ampm=
hours>=12
?
"PM"
:
"AM";


hours=
hours%12 || 12;


const time=

String(hours)
.padStart(2,"0")

+
":"
+
minutes
+
" "
+
ampm;


const timestamp=

day
+
"-"
+
month
+
"-"
+
year
+
" "
+
time;


data.submittedAt=
timestamp;


/* =========================================================
   SEND TO GOOGLE SHEETS
   ========================================================= */

try{


await fetch(

SCRIPT_URL,

{

method:"POST",

mode:"no-cors",

headers:{

"Content-Type":
"text/plain;charset=utf-8"

},

body:
JSON.stringify(data)

}

);


/* SUCCESS */

document.getElementById("app")
.innerHTML=`

<div class="success">

<h1>

Thank you! / धन्यवाद!

</h1>


<p>

Your response has been submitted successfully.

</p>


<p>

आपकी प्रतिक्रिया सफलतापूर्वक जमा हो गई है।

</p>

</div>

`;


}

catch(e){


document.getElementById("app")
.innerHTML=`

<div class="success">

<h1>

Submission completed

</h1>


<p>

If you see this page, please inform the researcher
to verify the response in the spreadsheet.

</p>

</div>

`;

}

}


/* =========================================================
   START
   ========================================================= */

render();


</script>
