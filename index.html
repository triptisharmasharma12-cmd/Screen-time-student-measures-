<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Measures for Active Screen Time — Student Questionnaire</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eaf3ff,#f7fbff);color:#1f2937;min-height:100vh}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:min(950px,100%);min-height:650px;background:#fff;border-radius:24px;box-shadow:0 12px 40px rgba(0,0,0,.12);padding:40px;display:flex;flex-direction:column}
.progress{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-bottom:28px}
.progress>div{height:100%;background:#1976d2;transition:.25s}
h1{font-size:29px;margin:0 0 12px;color:#1565c0;line-height:1.35}
h2{font-size:24px;line-height:1.4;margin:0 0 16px;color:#1976d2}
h3{color:#1565c0;margin:0 0 14px;font-size:18px;text-align:center}
.subtitle{color:#5f6b7a;line-height:1.6;margin-bottom:22px}
.question{flex:1;overflow:auto}
.question p{line-height:1.6;font-size:17px}
.option{display:flex;align-items:flex-start;gap:10px;background:#f7fbff;border:1px solid #d7e7f7;border-radius:12px;padding:13px;margin:9px 0;cursor:pointer;transition:.2s;font-weight:400;line-height:1.5}
.option:hover{background:#edf6ff;border-color:#90caf9}
.option input{margin-top:4px;transform:scale(1.15)}
label.field-label{display:block;font-size:17px;margin:14px 0 8px;font-weight:600}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font-size:16px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#1976d2;box-shadow:0 0 0 3px rgba(25,118,210,.10)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.box{border:1px solid #d7e7f7;border-radius:14px;padding:18px;margin-top:15px;background:#fbfdff}
.question-image-wrap{width:100%;display:flex;justify-content:center;align-items:center;margin:18px 0 24px}
.question-image{width:100%;max-width:760px;height:340px;object-fit:contain;object-position:center;display:block;margin:auto;border-radius:16px;border:1px solid #d7e7f7;background:#fff;padding:8px}
.large-question-image{width:100%;max-width:800px;height:420px;object-fit:contain;object-position:center;display:block;margin:18px auto 25px;border-radius:16px;border:1px solid #d7e7f7;background:#fff;padding:8px}
.image-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:20px;align-items:start}
.image-option{border:1px solid #d7e7f7;border-radius:16px;background:#f7fbff;padding:12px;cursor:pointer;transition:.2s;text-align:center}
.image-option:hover{background:#edf6ff;border-color:#90caf9;transform:translateY(-2px)}
.image-option img{width:100%;height:250px;object-fit:contain;object-position:center;border-radius:12px;display:block;margin-bottom:12px;background:#fff;padding:5px}
.image-option label{display:block;margin:0;font-weight:500;cursor:pointer;text-align:left;line-height:1.5}
.image-option input{margin-right:7px;transform:scale(1.15)}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}
button{border:0;border-radius:10px;padding:13px 24px;font-size:16px;font-weight:700;cursor:pointer;transition:.2s}
.back{background:#e5e7eb;color:#111827}
.back:hover{background:#d1d5db}
.next,.submit{background:#1976d2;color:#fff}
.next:hover,.submit:hover{background:#1565c0}
.error{display:none;color:#b91c1c;background:#fee2e2;padding:10px;border-radius:8px;margin-top:10px}
.success{text-align:center;padding:50px 20px}
.success h1{color:#1565c0}
.instructions{line-height:1.7;padding-left:22px}
.instructions li{margin-bottom:10px}
.muted{color:#5f6b7a;line-height:1.6}
@media(max-width:700px){.wrap{padding:12px}.card{padding:24px;min-height:95vh;border-radius:18px}.grid,.image-options{grid-template-columns:1fr}.image-option img{height:300px}.question-image{height:330px}.large-question-image{height:380px}h1{font-size:24px}h2{font-size:20px}}
</style></head><body><div class="wrap"><div class="card"><div class="progress"><div id="bar"></div></div><div id="app"></div><div class="nav" id="nav"><button class="back" id="back" onclick="prev()">Back / पीछे</button><button class="next" id="next" onclick="next()">Next / आगे</button></div></div></div>
<script>
  
// Google Apps Script deployment ID supplied by the researcher.
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxkCk-Etx0FTVfLQ0Co_DcteRs6aw-81ZDT88KW_l2Y1QqADivNqlkWzWyPAKJSYINpQ/exec";
// Keep these image files in the same folder as this HTML file.
const IMG={urban:"Urban Life.png",suburban:"Suburban Life.png",rural:"Rural Life.png",parentsMonitor:"parents monitor.png",health:"health related.png",deviceType:"device type.png",breaks:"breaks.png",deviceTime:"when to use digital device.png",purpose:"purpose.png",recreational:"recreational.png",total:"total image.png",activeRecreational:"active recreational time image.png",educationalTime:"educational time.png",sleepHours:"sleep hours.png",wakeUp:"wake up time.png",sleepTime:"sleep time.png",daytimeNap:"daytime nap.png"};
function image(file,alt="Question image"){return `<div class="question-image-wrap"><img class="question-image" src="${encodeURI(file)}" alt="${alt}" onerror="this.style.display='none'"></div>`}
function largeImage(file,alt="Question image"){return `<img class="large-question-image" src="${encodeURI(file)}" alt="${alt}" onerror="this.style.display='none'">`}
function options(name,items,type="radio",required=false){return items.map(x=>`<label class="option"><input type="${type}" name="${name}" value="${escapeAttr(x.value)}" ${required?'required':''}><span>${x.label}</span></label>`).join('')}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function imageOptions(name,items){return `<div class="image-options">${items.map(item=>`<div class="image-option"><img src="${encodeURI(item.image)}" alt="${item.alt||item.label}" onerror="this.style.display='none'"><label><input type="radio" name="${name}" value="${escapeAttr(item.value)}" required> ${item.label}</label></div>`).join('')}</div>`}
const yesNo=[{value:"Yes",label:"Yes / हाँ"},{value:"No",label:"No / नहीं"}];
const hours=[{value:"1 hour",label:"1 hour / 1 घंटा"},{value:"2 hours",label:"2 hours / 2 घंटे"},{value:"3 hours",label:"3 hours / 3 घंटे"},{value:"4 hours",label:"4 hours / 4 घंटे"},{value:"More than 4 hours",label:"More than 4 hours / 4 घंटे से अधिक"}];
function dualHours(question,n1,n2,img){return (img?image(img[0],img[1]):'')+`<p>${question}</p><div class="grid"><div class="box"><h3>On school days / स्कूल के दिनों में</h3>${options(n1,hours,'radio',true)}</div><div class="box"><h3>On holidays / छुट्टी के दिनों में</h3>${options(n2,hours,'radio',true)}</div></div>`}
const questions=[
{title:"Participant Code / प्रतिभागी कोड",html:`<p>Please enter the participant code provided to you. / कृपया आपको दिया गया प्रतिभागी कोड लिखें।</p><label class="field-label">Participant Code / प्रतिभागी कोड</label><input name="participant_code" type="text" required>`},
{title:"1. Demographic Information / जनसांख्यिकीय जानकारी",html:`<label class="field-label">What is your present age? / आपकी वर्तमान आयु कितनी है?</label>${options('age',[10,11,12,13,14,15].map(n=>({value:String(n),label:n+' years / वर्ष'})),'radio',true)}<label class="field-label">In which grade do you study? / आप किस कक्षा में पढ़ते हैं?</label>${options('grade',[{value:'Class 6',label:'Class 6 / कक्षा 6'},{value:'Class 7',label:'Class 7 / कक्षा 7'},{value:'Class 8',label:'Class 8 / कक्षा 8'}],'radio',true)}<label class="field-label">How do you identify your gender? / आप अपने लिंग की पहचान कैसे करते हैं?</label>${options('gender',[{value:'Male',label:'Male / पुरुष'},{value:'Female',label:'Female / महिला'},{value:'Other',label:'Other / अन्य'},{value:'Prefer not to say',label:'Prefer not to say / बताना नहीं चाहते'}],'radio',true)}`},
{title:"2. Residential Area / निवास क्षेत्र",html:`<p>What type of area do you currently live in? / आप वर्तमान में किस प्रकार के क्षेत्र में रहते हैं?</p>${imageOptions('area',[{value:'Urban',label:'Urban / शहरी क्षेत्र',image:IMG.urban},{value:'Suburban',label:'Suburban / उपनगरीय क्षेत्र',image:IMG.suburban},{value:'Rural',label:'Rural / ग्रामीण क्षेत्र',image:IMG.rural}])}`},
{title:"3. Family Information / पारिवारिक जानकारी",html:`<label class="field-label">How many siblings do you have? / आपके कितने भाई-बहन हैं?</label>${options('siblings',[{value:'0',label:'0'},{value:'1',label:'1'},{value:'2',label:'2'},{value:'3',label:'3'},{value:'More than 3',label:'More than 3 / 3 से अधिक'}],'radio',true)}<label class="field-label">What do your parents do for a living? / आपके माता-पिता क्या काम करते हैं?</label><input name="parents_occupation" type="text" required>`},
{title:"4. Parental Monitoring / माता-पिता की निगरानी",html:image(IMG.parentsMonitor,'Parents monitoring digital content')+`<p>Do your parents monitor what content and how much time you spend using digital gadgets? / क्या आपके माता-पिता इस बात पर नज़र रखते हैं कि आप डिजिटल गैजेट्स पर कौन-सी सामग्री देखते हैं और उनका उपयोग कितने समय तक करते हैं?</p>${options('parental_monitoring',yesNo,'radio',true)}`},
{title:"5. Health Information / स्वास्थ्य संबंधी जानकारी",html:image(IMG.health,'Health-related condition')+`<p>Do you have any health-related condition or are you currently receiving any treatment that may affect your participation in the study activities? / क्या आपको कोई ऐसी स्वास्थ्य संबंधी समस्या है या आपका कोई उपचार चल रहा है, जो इस अध्ययन की गतिविधियों में आपकी भागीदारी को प्रभावित कर सकता है?</p>${options('health_condition',[...yesNo,{value:'Prefer not to disclose',label:'Prefer not to disclose / बताना नहीं चाहते'}],'radio',true)}<p>To the best of your knowledge, do you currently have any of the following conditions that may affect your participation in this study? / आपकी जानकारी के अनुसार, क्या वर्तमान में आपको निम्नलिखित में से कोई ऐसी स्थिति है जो इस अध्ययन में आपकी भागीदारी को प्रभावित कर सकती है?</p>${options('conditions',[{value:'ADHD',label:'ADHD'},{value:'Specific learning difficulty, such as Dyslexia',label:'Specific learning difficulty, such as Dyslexia / विशिष्ट अधिगम संबंधी कठिनाई, जैसे डिस्लेक्सिया'},{value:'Neurological condition',label:'Neurological condition / तंत्रिका संबंधी स्थिति'},{value:'None',label:'None / इनमें से कोई नहीं'},{value:'Prefer not to disclose',label:'Prefer not to disclose / बताना नहीं चाहते'}],'checkbox',false)}`},
{title:"Active Screen Time 1 / सक्रिय स्क्रीन टाइम 1",html:image(IMG.deviceType,'Types of digital devices')+`<p>What type of digital device(s) do you have at home? [You can choose multiple options] / आपके घर पर किस तरह के डिजिटल डिवाइस हैं? [आप एक से ज़्यादा विकल्प चुन सकते हैं]</p>${options('home_devices',[{value:'Computer',label:'Computer / कंप्यूटर'},{value:'Smartphone',label:'Smartphone / स्मार्टफोन'},{value:'iPad or Tablets',label:'iPad or Tablets / आइपैड या टैबलेट'},{value:'Laptop',label:'Laptop / लैपटॉप'},{value:'Television',label:'Television / टेलीविज़न'},{value:'Other',label:'Other / अन्य'}],'checkbox') }<label class="field-label">If Other, please specify / यदि अन्य, तो कृपया लिखें</label><input name="home_devices_other" type="text">`},
{title:"Active Screen Time 2 / सक्रिय स्क्रीन टाइम 2",html:`<p>How many digital devices does your family own? / आपके परिवार के पास कितने डिजिटल डिवाइस हैं?</p><input name="family_device_count" type="number" min="0" required placeholder="Enter number / संख्या लिखें">`},
{title:"Active Screen Time 3 / सक्रिय स्क्रीन टाइम 3",html:`<p>Do you have a personal Mobile Phone? / क्या आपके पास अपना मोबाइल फ़ोन है?</p>${options('personal_mobile',yesNo,'radio',true)}`},
{title:"Active Screen Time 4 / सक्रिय स्क्रीन टाइम 4",html:`<p>Which device do you use most of the time? [You can choose multiple options] / आप ज़्यादातर कौन-सा डिवाइस इस्तेमाल करते हैं? [आप एक से ज़्यादा विकल्प चुन सकते हैं]</p>${options('most_used_device',[{value:'Personal Phone',label:'Personal Phone / अपना फ़ोन'},{value:'Mother’s Phone',label:'Mother’s Phone / माँ का फ़ोन'},{value:'Father’s Phone',label:'Father’s Phone / पिता का फ़ोन'},{value:'iPad or Tablet',label:'iPad or Tablet / आइपैड या टैबलेट'},{value:'Laptop',label:'Laptop / लैपटॉप'},{value:'Computer',label:'Computer / कंप्यूटर'},{value:'Other',label:'Other / अन्य'}],'checkbox')}<label class="field-label">If Other, please specify / यदि अन्य, तो कृपया लिखें</label><input name="most_used_device_other" type="text">`},
{title:"Active Screen Time 5 / सक्रिय स्क्रीन टाइम 5",html:image(IMG.deviceTime,'Preferred time to use digital devices')+`<p>What time of day do you usually prefer to use digital devices or play digital games? / आप आमतौर पर दिन के किस समय डिजिटल डिवाइस का उपयोग करना या उन पर खेलना पसंद करते हैं?</p>${options('device_time_preference',[{value:'Just after you wake up',label:'Just after you wake up / सुबह उठने के तुरंत बाद'},{value:'Before going to school',label:'Before going to school / स्कूल जाने से पहले'},{value:'After coming back from school',label:'After coming back from school / स्कूल से वापस आने के बाद'},{value:'In the late evening',label:'In the late evening / देर शाम को'},{value:'Before going to bed',label:'Before going to bed / सोने से पहले'}],'checkbox')}`},
{title:"Active Screen Time 6 / सक्रिय स्क्रीन टाइम 6",html:dualHours('How much total time do you spend on digital screens? / आप डिजिटल स्क्रीन पर कुल कितना समय बिताते हैं?','total_screen_school_day','total_screen_holiday',[IMG.total,'Total screen time'])},
{title:"Active Screen Time 7 / सक्रिय स्क्रीन टाइम 7",html:image(IMG.breaks,'Screen breaks')+`<p>Do you take breaks while using digital screens? / क्या आप डिजिटल स्क्रीन का उपयोग करते समय बीच-बीच में ब्रेक लेते हैं?</p>${options('screen_breaks',yesNo,'radio',true)}<div id="screenBreakDetails" style="display:none"><p>If yes, how many separate periods or sessions do you usually use digital screens during the day? / यदि हाँ, तो आप आमतौर पर दिन में कितनी अलग-अलग अवधि या सत्रों में डिजिटल स्क्रीन का उपयोग करते हैं?</p>${options('screen_sessions',[{value:'1 session',label:'1 session / 1 बार'},{value:'2 sessions',label:'2 sessions / 2 बार'},{value:'3 sessions',label:'3 sessions / 3 बार'},{value:'4 sessions',label:'4 sessions / 4 बार'},{value:'5 or more sessions',label:'5 or more sessions / 5 या अधिक बार'}],'radio',false)}<p>Please mention the approximate duration of each screen-use session. For example: 1 hour in the morning and 3 hours in the evening. / कृपया डिजिटल स्क्रीन के उपयोग की प्रत्येक अवधि का अनुमानित समय लिखें। उदाहरण के लिए: सुबह 1 घंटा और शाम को 3 घंटे।</p><div class="grid">${['Morning|सुबह','Afternoon|दोपहर','Evening|शाम','Night|रात'].map(x=>{let [en,hi]=x.split('|');return `<div><label class="field-label">${en} / ${hi}</label><input name="screen_${en.toLowerCase()}" type="text" placeholder="hours/minutes / घंटे/मिनट"></div>`}).join('')}</div></div>`},
{title:"Active Screen Time 8 / सक्रिय स्क्रीन टाइम 8",html:dualHours('How much total time do you spend on digital screens for recreational purposes? Examples include watching videos or reels, playing games, using social media, chatting with friends, browsing the internet for entertainment, listening to music, or other leisure activities. / आप मनोरंजन के लिए डिजिटल स्क्रीन पर कुल कितना समय बिताते हैं? उदाहरणों में वीडियो या रील देखना, गेम खेलना, सोशल मीडिया का उपयोग करना, दोस्तों से चैट करना, मनोरंजन के लिए इंटरनेट ब्राउज़ करना, संगीत सुनना या अन्य मनोरंजक गतिविधियाँ शामिल हैं।','recreational_screen_school_day','recreational_screen_holiday',[IMG.recreational,'Recreational screen time'])},
{title:"Active Screen Time 9 / सक्रिय स्क्रीन टाइम 9",html:dualHours('How much total time do you spend using digital screens for active recreational purposes? For example, playing video games, commenting on and creating content on social media. / आप मनोरंजन के लिए डिजिटल स्क्रीन का सक्रिय रूप से उपयोग करने में कुल कितना समय बिताते हैं? उदाहरण के लिए, वीडियो गेम खेलना, सोशल मीडिया पर टिप्पणी करना और सामग्री बनाना।','active_recreational_school_day','active_recreational_holiday',[IMG.activeRecreational,'Active recreational screen time'])},
{title:"Active Screen Time 10 / सक्रिय स्क्रीन टाइम 10",html:dualHours('How much time do you spend on digital screens for educational purposes? / आप शैक्षिक उद्देश्यों के लिए डिजिटल स्क्रीन पर कितना समय बिताते हैं?','educational_screen_school_day','educational_screen_holiday',[IMG.educationalTime,'Educational screen time'])},
{title:"Active Screen Time 11 / सक्रिय स्क्रीन टाइम 11",html:image(IMG.purpose,'Recreational screen-use purposes')+`<p>What is your main purpose for using digital gadgets for recreational purposes? [You may select multiple options] / आप मनोरंजन के लिए डिजिटल गैजेट्स का उपयोग मुख्य रूप से किस उद्देश्य से करते हैं? [आप एक से अधिक विकल्प चुन सकते हैं]</p><div class="grid"><div class="box"><h3>On school days / स्कूल के दिनों में</h3>${options('recreation_purpose_school_day',[{value:'Video gaming',label:'Video gaming / वीडियो गेम खेलना'},{value:'Cognitive games (like chess, Sudoku, etc.)',label:'Cognitive games (like chess, Sudoku, etc.) / संज्ञानात्मक खेल (जैसे शतरंज, सुडोकू आदि)'},{value:'Active social media use',label:'Active social media use (uploading videos, commenting, posting content) / सोशल मीडिया का सक्रिय उपयोग'},{value:'Scrolling reels / watching videos passively',label:'Scrolling reels / watching videos passively / रील्स स्क्रॉल करना या वीडियो निष्क्रिय रूप से देखना'},{value:'Other',label:'Other / अन्य'}],'checkbox')}<label class="field-label">If Other, specify / यदि अन्य, लिखें</label><input name="recreation_purpose_school_day_other" type="text"></div><div class="box"><h3>On holidays / छुट्टी के दिनों में</h3>${options('recreation_purpose_holiday',[{value:'Video gaming',label:'Video gaming / वीडियो गेम खेलना'},{value:'Cognitive games (like chess, Sudoku, etc.)',label:'Cognitive games (like chess, Sudoku, etc.) / संज्ञानात्मक खेल'},{value:'Active social media use',label:'Active social media use / सोशल मीडिया का सक्रिय उपयोग'},{value:'Scrolling reels / watching videos passively',label:'Scrolling reels / watching videos passively / रील्स स्क्रॉल करना या वीडियो देखना'},{value:'Other',label:'Other / अन्य'}],'checkbox')}<label class="field-label">If Other, specify / यदि अन्य, लिखें</label><input name="recreation_purpose_holiday_other" type="text"></div></div>`},

function wakeOptions(){return ['Earlier than 06:00 am / सुबह 06:00 बजे से पहले','06:00 am–06:30 am / सुबह 06:00–06:30 बजे','06:30 am–07:00 am / सुबह 06:30–07:00 बजे','07:00 am–07:30 am / सुबह 07:00–07:30 बजे','07:30 am–08:00 am / सुबह 07:30–08:00 बजे','08:00 am–08:30 am / सुबह 08:00–08:30 बजे','08:30 am–09:00 am / सुबह 08:30–09:00 बजे','09:00 am–09:30 am / सुबह 09:00–09:30 बजे','Later than 09:30 am / सुबह 09:30 बजे के बाद'].map(x=>({value:x,label:x}))}
function bedOptions(){return ['Earlier than 09:00 pm / रात 09:00 बजे से पहले','09:00 pm–09:30 pm / रात 09:00–09:30 बजे','09:30 pm–10:00 pm / रात 09:30–10:00 बजे','10:00 pm–10:30 pm / रात 10:00–10:30 बजे','10:30 pm–11:00 pm / रात 10:30–11:00 बजे','11:00 pm–11:30 pm / रात 11:00–11:30 बजे','Later than 11:30 pm / रात 11:30 बजे के बाद'].map(x=>({value:x,label:x}))}
let page=-1;const data={};
const introHTML=`<div class="question"><h1>Measures for Active Screen Time / सक्रिय स्क्रीन टाइम का मापन</h1><div class="subtitle"><strong>Research Title:</strong><br>Comparative Impact of Screen Time and Green Time on Proactive and Reactive Inhibitory Control among Middle Stage Students: An Event-Related Potential Analysis</div><h2>Purpose / उद्देश्य</h2><p>This form is designed to assess your active recreational screen time, including the frequency and duration of interactive screen-based activities. The information collected will be used solely for academic research purposes.</p><p>यह प्रपत्र आपके सक्रिय मनोरंजक स्क्रीन टाइम का आकलन करने के लिए तैयार किया गया है, जिसमें इंटरैक्टिव स्क्रीन-आधारित गतिविधियों की आवृत्ति और अवधि शामिल है। इस प्रपत्र से प्राप्त जानकारी का उपयोग केवल शैक्षणिक शोध उद्देश्यों के लिए किया जाएगा।</p><h2>Instructions / निर्देश</h2><ul class="instructions"><li>Answer each question based on your usual screen-use pattern. / प्रत्येक प्रश्न का उत्तर अपने सामान्य स्क्रीन उपयोग के तरीके के आधार पर दें।</li><li>Consider your typical daily use, not an unusually high or low day. / अपने सामान्य दैनिक उपयोग को ध्यान में रखें, किसी असामान्य दिन को नहीं।</li><li>Include recreational activities such as gaming, social media, short videos, chatting, browsing, and content editing. / गेम खेलना, सोशल मीडिया, शॉर्ट वीडियो, चैटिंग, ब्राउज़िंग और सामग्री संपादित करने जैसी मनोरंजक गतिविधियाँ शामिल करें।</li><li>Do not include screen use for schoolwork, homework, online classes, or other academic activities when answering recreational screen-time questions. / मनोरंजक स्क्रीन टाइम के प्रश्नों में स्कूल के काम, गृहकार्य, ऑनलाइन कक्षाओं या अन्य शैक्षणिक गतिविधियों को शामिल न करें।</li><li>Select the response that best represents your usual behavior. / वह विकल्प चुनें जो आपके सामान्य व्यवहार को सबसे अच्छी तरह दर्शाता हो।</li><li>There are no right or wrong answers. Please answer honestly and carefully. / कोई सही या गलत उत्तर नहीं है। कृपया ईमानदारी और सावधानी से उत्तर दें।</li><li>Please answer all questions. / कृपया सभी प्रश्नों का उत्तर दें।</li></ul><p class="muted">Your responses will be kept confidential and used only for research purposes. / आपकी जानकारी गोपनीय रखी जाएगी और केवल शोध उद्देश्यों के लिए उपयोग की जाएगी।</p></div>`;
function collect(){document.querySelectorAll('#app input,#app select,#app textarea').forEach(el=>{if(!el.name)return;if((el.type==='checkbox'||el.type==='radio')&&!el.checked)return;if(el.type==='checkbox'){let old=(data[el.name]||'').split('|||').filter(Boolean);if(!old.includes(el.value))old.push(el.value);data[el.name]=old.join('|||')}else data[el.name]=el.value})}
function restore(){Object.keys(data).forEach(k=>document.querySelectorAll(`[name="${CSS.escape(k)}"]`).forEach(el=>{if(el.type==='checkbox'||el.type==='radio')el.checked=(data[k]||'').split('|||').includes(el.value);else el.value=data[k]}))}
function setupConditional(){const box=document.getElementById('screenBreakDetails');if(!box)return;const update=()=>{const a=document.querySelector('[name="screen_breaks"]:checked');box.style.display=a&&a.value==='Yes'?'block':'none';if(!a||a.value!=='Yes')box.querySelectorAll('input').forEach(el=>{if(el.type==='radio'||el.type==='checkbox')el.checked=false;else el.value=''})};document.querySelectorAll('[name="screen_breaks"]').forEach(el=>el.addEventListener('change',update));update()}
function render(){if(page===-1){document.getElementById('app').innerHTML=introHTML;document.getElementById('back').style.visibility='hidden';document.getElementById('next').textContent='Start Questionnaire / प्रश्नावली शुरू करें';document.getElementById('bar').style.width='0%';return}const q=questions[page];document.getElementById('app').innerHTML=`<div class="question"><h2>${q.title}</h2>${q.html}<div id="err" class="error">Please answer the required question before continuing. / कृपया आगे बढ़ने से पहले आवश्यक प्रश्न का उत्तर दें।</div></div>`;restore();setupConditional();document.getElementById('back').style.visibility=page===0?'hidden':'visible';document.getElementById('next').textContent=page===questions.length-1?'Submit / जमा करें':'Next / आगे';document.getElementById('bar').style.width=((page+1)/questions.length*100)+'%'}
function valid(){const err=document.getElementById('err');if(err)err.style.display='none';const q=questions[page];const requiredRadios=[...document.querySelectorAll('#app input[type=radio][required]')];const names=[...new Set(requiredRadios.map(x=>x.name))];for(const name of names){if(!document.querySelector(`#app input[type=radio][name="${CSS.escape(name)}"]:checked`)){if(err)err.style.display='block';return false}}for(const el of document.querySelectorAll('#app input[required]:not([type=radio]):not([type=checkbox])')){if(!el.value.trim()){if(err)err.style.display='block';el.focus();return false}}if(page===12){const a=document.querySelector('[name="screen_breaks"]:checked');if(a&&a.value==='Yes'&&!document.querySelector('[name="screen_sessions"]:checked')){if(err)err.style.display='block';return false}}return true}
function next(){if(page===-1){page=0;render();return}if(!valid())return;collect();if(page<questions.length-1){page++;render();window.scrollTo(0,0)}else submitForm()}
function prev(){if(page===-1)return;collect();if(page>0)page--;else page=-1;render();window.scrollTo(0,0)}
async function submitForm(){collect();data.submittedAt=new Date().toISOString();document.getElementById('nav').style.display='none';document.getElementById('app').innerHTML='<div class="success"><h1>Submitting… / जमा किया जा रहा है…</h1><p>Please wait / कृपया प्रतीक्षा करें।</p></div>';try{await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});document.getElementById('app').innerHTML='<div class="success"><h1>Thank you! / धन्यवाद!</h1><p>Your response has been submitted. / आपकी प्रतिक्रिया जमा कर दी गई है।</p></div>'}catch(e){document.getElementById('app').innerHTML='<div class="success"><h1>Submission status unclear / स्थिति की पुष्टि आवश्यक</h1><p>Please inform the researcher to verify the response in the spreadsheet. / कृपया शोधकर्ता से स्प्रेडशीट में प्रतिक्रिया की पुष्टि करने को कहें।</p></div>'}}
render();
</script></body></html>
